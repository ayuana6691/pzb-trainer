name: Windows build and preview release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64 UI preview
        shell: pwsh
        run: |
          dotnet publish src/PBZTrainer/PBZTrainer.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:EmbedBridge=false -o out/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $asset = 'PBZTrainer-UI-preview-win-x64.zip'
          Compress-Archive -LiteralPath 'out/ci/PBZTrainer.exe', 'LICENSE', 'NOTICE.md' `
            -DestinationPath "out/ci/$asset" -CompressionLevel NoCompression
          $hash = (Get-FileHash -LiteralPath "out/ci/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'out/ci/SHA256SUMS.txt' -Encoding ascii -NoNewline -Value "$hash  $asset`n"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PBZTrainer-UI-preview-win-x64
          path: |
            out/ci/PBZTrainer-UI-preview-win-x64.zip
            out/ci/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PBZTrainer-UI-preview-win-x64
          path: release

      - name: Publish tagged GitHub prerelease
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" PBZTrainer-UI-preview-win-x64.zip SHA256SUMS.txt \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME · Windows UI 预览" \
            --notes 'Windows x64 UI 预览包，自带 .NET 运行时。运行模块需要单独提供。'
